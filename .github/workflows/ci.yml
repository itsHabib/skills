name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run registry checks
        run: bash scripts/check.sh

      # The scrub gate is only worth its exit code if the patterns still match
      # what leaks, so the gate's own guard test runs beside it.
      - name: Run scrub-gate self-test
        run: bash scripts/check-selftest.sh
