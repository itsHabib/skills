name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run registry checks
        run: bash scripts/check.sh

      - name: Test consensus helpers
        run: python3 -B -m unittest discover -s skills/consensus/scripts -p 'test_*.py'

      - name: Test Boost discovery harness
        run: python3 -B -m unittest discover -s tests/boost-discovery -p 'test_*.py'
